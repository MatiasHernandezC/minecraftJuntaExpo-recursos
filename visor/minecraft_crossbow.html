'Marco':()=>{const pared=new THREE.Mesh(new THREE.BoxGeometry(3,3,0.2),new THREE.MeshLambertMaterial({color:0x6b6b6b}));pared.position.z=-0.6;raiz.add(pared);const tabla=new THREE.Mesh(new THREE.BoxGeometry(0.75,0.75,0.0625),new THREE.MeshLambertMaterial({color:0x8a5a2b}));tabla.position.z=-0.47;raiz.add(tabla);
raiz.add(conMatriz(itemGrupo(C.fixed,'fixed'),new M4().makeRotationY(Math.PI).multiply(new M4().makeTranslation(0,0,0.4375)).multiply(new M4().makeScale(0.5,0.5,0.5))));persp(new V(0,0,-0.4),1.6,0,0)},
'Item display':()=>{raiz.add(piso());raiz.add(conMatriz(itemGrupo(C.none,'none'),new M4().makeTranslation(0,0.5,0).multiply(new M4().makeRotationY(Math.PI))));persp(new V(0,0.5,0),2,0.6,0.35)}};
let prim=null;for(const[n,f]of Object.entries(vistas)){const b=boton(n,()=>{limpia();f()},'v');prim=prim||b}setTimeout(()=>prim.click());
const sin=Object.entries(C).filter(([k,v])=>!v).map(([k])=>k);
nota.textContent=(sin.length?'Sin modelo propio en: '+sin.join(', ')+' (el juego lo dibuja aparte; se muestra una caja). ':'')+'Primera y tercera persona y cabeza son aproximadas al juego.';
}
let dr=null,pinch=0;
el.addEventListener('pointerdown',e=>{dr=[e.clientX,e.clientY];el.setPointerCapture(e.pointerId)});
el.addEventListener('pointermove',e=>{if(!dr||!orbita)return;yaw-=(e.clientX-dr[0])*0.01;pitch=Math.max(-1.4,Math.min(1.4,pitch+(e.clientY-dr[1])*0.01));dr=[e.clientX,e.clientY]});
el.addEventListener('pointerup',()=>dr=null);
el.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(0.3,Math.min(20,dist*(1+Math.sign(e.deltaY)*0.1)))},{passive:false});
el.addEventListener('touchmove',e=>{if(e.touches.length==2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)dist=Math.max(0.3,Math.min(20,dist*pinch/d));pinch=d}},{passive:true});
el.addEventListener('touchend',()=>pinch=0);
function rs(){const w=el.clientWidth,h=el.clientHeight;R.setSize(w,h);camP.aspect=w/h;camP.updateProjectionMatrix()}rs();addEventListener('resize',rs);
(function loop(t){if(orbita&&cam==camP){camP.position.set(centro.x+dist*Math.cos(pitch)*Math.sin(yaw),centro.y+dist*Math.sin(pitch),centro.z+dist*Math.cos(pitch)*Math.cos(yaw));camP.lookAt(centro);if(camP.fov!=50){camP.fov=50;camP.updateProjectionMatrix()}}
if(anim)anim(t||0);R.render(S,cam);requestAnimationFrame(loop)})();
</script></body></html>
