function rotaEl(v,r){if(!r)return v;const o=r.origin,a=(r.angle||0)*rad,c=Math.cos(a),s=Math.sin(a);let x=v[0]-o[0],y=v[1]-o[1],z=v[2]-o[2],p;
if(r.axis=='x')p=[x,y*c-z*s,y*s+z*c];else if(r.axis=='y')p=[x*c+z*s,y,-x*s+z*c];else p=[x*c-y*s,x*s+y*c,z];
if(r.rescale){const k=1/Math.cos(a);if(r.axis!='x')p[0]*=k;if(r.axis!='y')p[1]*=k;if(r.axis!='z')p[2]*=k}return[p[0]+o[0],p[1]+o[1],p[2]+o[2]]}
function rotaBloque(v,bx,by){let[x,y,z]=[v[0]-8,v[1]-8,v[2]-8];if(bx){const a=-bx*rad,c=Math.cos(a),s=Math.sin(a);[y,z]=[y*c-z*s,y*s+z*c]}if(by){const a=-by*rad,c=Math.cos(a),s=Math.sin(a);[x,z]=[x*c+z*s,-x*s+z*c]}return[x+8,y+8,z+8]}
function generado(capas){const g=new THREE.Group();for(const k of capas){const t=D.texturas[k];if(!t||!t.px)continue;const n=t.px.filter(p=>p[3]>25).length;if(!n)continue;
const im=new THREE.InstancedMesh(new THREE.BoxGeometry(16/t.w,16/t.h,1),new THREE.MeshLambertMaterial(),n);let i=0;const m=new M4(),c=new THREE.Color();
for(let y=0;y<t.h;y++)for(let x=0;x<t.w;x++){const p=t.px[y*t.w+x];if(p[3]<=25)continue;m.makeTranslation((x+.5)*16/t.w,16-(y+.5)*16/t.h,8);im.setMatrixAt(i,m);c.setRGB(p[0]/255,p[1]/255,p[2]/255);c.convertSRGBToLinear&&0;im.setColorAt(i,c);i++}
g.add(im)}return g}
function construye(md){const g=new THREE.Group();if(!md)return g;if(md.generado)return generado(md.generado);
const por={};for(const e of md.elementos||[]){const f=e.from,t=e.to;for(const[d,c]of Object.entries(e.caras)){const q=CARAS[d];if(!q)continue;
const vs=q.map(b=>{let v=[b[0]?t[0]:f[0],b[1]?t[1]:f[1],b[2]?t[2]:f[2]];v=rotaEl(v,e.rot);if(md.bx||md.by)v=rotaBloque(v,md.bx,md.by);return v});
const uv=c.uv||uvDef(d,f,t),co=[[uv[0],uv[1]],[uv[0],uv[3]],[uv[2],uv[3]],[uv[2],uv[1]]],k=((c.rot||0)/90)|0;
const key=c.tex||'?';(por[key]=por[key]||{p:[],u:[]});const P=por[key];
for(const i of[0,1,2,0,2,3]){P.p.push(...vs[i]);const w=co[(i+k)%4];P.u.push(w[0]/16,1-w[1]/16)}}}
for(const[k,P]of Object.entries(por)){const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(P.p,3));geo.setAttribute('uv',new THREE.Float32BufferAttribute(P.u,2));geo.computeVertexNormals();g.add(new THREE.Mesh(geo,mat(k)))}
return g}
const cacheMod={};function modeloGrupo(ref){if(!(ref in cacheMod))cacheMod[ref]=construye(D.modelos[ref]);return cacheMod[ref].clone()}
function disp(md,ctx){const t=(md&&md.display&&md.display[ctx])||{},r=t.rotation||[0,0,0],tr=t.translation||[0,0,0],s=t.scale||[1,1,1];
return new M4().compose(new V(tr[0]/16,tr[1]/16,tr[2]/16),new THREE.Quaternion().setFromEuler(new THREE.Euler(r[0]*rad,r[1]*rad,r[2]*rad,'XYZ')),new V(s[0],s[1],s[2]))}
function conMatriz(obj,m){const g=new THREE.Group();g.matrixAutoUpdate=false;g.matrix.copy(m);g.add(obj);return g}
function itemGrupo(ref,ctx){const md=ref?D.modelos[ref]:null;let inner;
if(!md){inner=new THREE.Mesh(new THREE.BoxGeometry(14,14,14),new THREE.MeshLambertMaterial({color:0x8a6a3a}));inner.position.set(8,8,8)}else inner=modeloGrupo(ref);
return conMatriz(inner,disp(md,ctx).multiply(new M4().makeTranslation(-.5,-.5,-.5)).multiply(new M4().makeScale(1/16,1/16,1/16)))}
function matEnt(m){if(Array.isArray(m)){return new M4().set(...m)}const T=new M4().makeTranslation(...m.t),L=new M4().makeRotationFromQuaternion(new THREE.Quaternion(...m.l)),Sc=new M4().makeScale(...m.s),Rr=new M4().makeRotationFromQuaternion(new THREE.Quaternion(...m.r));return T.multiply(L).multiply(Sc).multiply(Rr)}
function caja(x,y,z,w,h,d,color){const m=new THREE.Mesh(new THREE.BoxGeometry(w/16,h/16,d/16),new THREE.MeshLambertMaterial({color}));m.position.set((x+w/2)/16,(y+h/2)/16,(z+d/2)/16);return m}
function parte(px,py,pz,rx,ry,rz){const g=new THREE.Group();g.position.set(px/16,py/16,pz/16);g.rotation.set(rx||0,ry||0,rz||0,'ZYX');return g}
function jugador(){const P=new THREE.Group();P.matrixAutoUpdate=false;P.matrix.copy(new M4().makeScale(1,-1,-1).multiply(new M4().makeTranslation(0,-1.501,0)));
const piel=0xc9a37e,ropa=0x3b6ea8,pant=0x3a3f8c;
const cab=parte(0,0,0);cab.add(caja(-4,-8,-4,8,8,8,piel));P.add(cab);
const cue=parte(0,0,0);cue.add(caja(-4,0,-2,8,12,4,ropa));P.add(cue);
const bd=parte(-5,2,0,-Math.PI/10);bd.add(caja(-3,-2,-2,4,12,4,piel));P.add(bd);
const bi=parte(5,2,0);bi.add(caja(-1,-2,-2,4,12,4,piel));P.add(bi);
for(const x of[-1.9,1.9]){const p=parte(x,12,0);p.add(caja(-2,0,-2,4,12,4,pant));P.add(p)}
return{P,cab,bd}}
function piso(){const g=new THREE.Group();const m=new THREE.Mesh(new THREE.PlaneGeometry(6,6),new THREE.MeshLambertMaterial({color:0x4d6b3a}));m.rotation.x=-Math.PI/2;g.add(m);const gr=new THREE.GridHelper(6,6,0x5f7f4a,0x5f7f4a);gr.position.y=0.001;g.add(gr);return g}
let raiz=new THREE.Group();S.add(raiz);
function limpia(){S.remove(raiz);raiz=new THREE.Group();S.add(raiz);anim=null}
function boton(txt,fn,grupo){const b=document.createElement('button');b.textContent=txt;b.onclick=()=>{document.querySelectorAll('button[data-g="'+grupo+'"]').forEach(x=>x.classList.remove('on'));b.classList.add('on');fn()};b.dataset.g=grupo;document.getElementById('botones').appendChild(b);return b}
function persp(c,d,y,p){cam=camP;orbita=true;centro.copy(c);dist=d;yaw=y;pitch=p}
if(D.modo=='entidad'){
let fantasma=null;
function arma(pose,encuadra){limpia();
for(const e of D.ents){const tag=e.tags.find(t=>pose[t]);const m=matEnt(tag?pose[tag]:e.m);const md=D.modelos[e.ref];let obj;
if(e.tipo=='block_display')obj=conMatriz(modeloGrupo(e.ref),new M4().makeScale(1/16,1/16,1/16));
else obj=conMatriz(itemGrupo(e.ref,'none'),new M4().makeRotationY(Math.PI));
raiz.add(conMatriz(obj,m))}
if(fantasma){const j=jugador();const g=new THREE.Group();g.add(j.P);g.position.x=1.6;raiz.add(g)}
raiz.updateMatrixWorld(true);const bb=new THREE.Box3().setFromObject(raiz);const pi=piso();pi.position.y=bb.min.y;raiz.add(pi);if(encuadra){bb.getCenter(centro);dist=Math.max(1.2,bb.getSize(new V()).length()*1.3)}}
let actual={},prim=true;const nombres=Object.keys(D.poses);
nombres.forEach((n,i)=>{const b=boton(n,()=>{actual=D.poses[n];arma(actual,prim);prim=false},'p');if(i==Math.min(1,nombres.length-1))setTimeout(()=>b.click())});
boton('Jugador al lado',()=>{fantasma=!fantasma;arma(actual)},'j');
cam=camP;orbita=true;yaw=0.6;pitch=0.35;
nota.textContent=D.ents.length+' piezas. Arrastra para girar, rueda o pellizco para acercar. Los pasajeros se ven desde el punto donde van montados.';
}else{
const C=D.ctx;
const vistas={
'Hotbar':()=>{cam=camO;orbita=false;const w=3.4,h=w*el.clientHeight/el.clientWidth;camO.left=-w/2;camO.right=w/2;camO.top=h/2;camO.bottom=-h/2;camO.position.set(0,0,5);camO.lookAt(0,0,0);camO.updateProjectionMatrix();
for(let i=-1;i<=1;i++){const s=new THREE.Mesh(new THREE.PlaneGeometry(1.1,1.1),new THREE.MeshBasicMaterial({color:i?0x2b2b2b:0x8b8b8b}));s.position.set(i*1.1,0,-2);raiz.add(s);const s2=new THREE.Mesh(new THREE.PlaneGeometry(0.98,0.98),new THREE.MeshBasicMaterial({color:0x3c3c3c}));s2.position.set(i*1.1,0,-1.9);raiz.add(s2)}
raiz.add(conMatriz(itemGrupo(C.gui,'gui'),new M4().makeScale(0.9,0.9,0.9)))},
'Primera persona':()=>{cam=camP;orbita=false;const as=el.clientWidth/el.clientHeight;camP.fov=as<16/9?2*Math.atan(Math.tan(35*rad)*(16/9)/as)/rad:70;camP.position.set(0,0,0);camP.lookAt(0,0,-1);camP.updateProjectionMatrix();
raiz.add(conMatriz(itemGrupo(C.firstperson_righthand,'firstperson_righthand'),new M4().makeTranslation(0.56,-0.52,-0.72)))},
'Tercera persona':()=>{const j=jugador();j.bd.add(conMatriz(itemGrupo(C.thirdperson_righthand,'thirdperson_righthand'),new M4().makeRotationX(-Math.PI/2).multiply(new M4().makeRotationY(Math.PI)).multiply(new M4().makeTranslation(1/16,0.125,-0.625))));raiz.add(j.P);raiz.add(piso());persp(new V(0,1,0),3.2,0.5,0.2)},
'Cabeza':()=>{const j=jugador();j.cab.add(conMatriz(itemGrupo(C.head,'head'),new M4().makeTranslation(0,-0.25,0).multiply(new M4().makeRotationY(Math.PI)).multiply(new M4().makeScale(0.625,-0.625,-0.625))));raiz.add(j.P);raiz.add(piso());persp(new V(0,1.6,0),2.2,0.5,0.25)},
'Suelo':()=>{raiz.add(piso());const md=C.ground?D.modelos[C.ground]:null,sy=((md&&md.display.ground&&md.display.ground.scale)||[1,1,1])[1];const g=new THREE.Group();g.position.y=0.1+0.25*sy;g.add(itemGrupo(C.ground,'ground'));raiz.add(g);anim=t=>{g.rotation.y=t/1000;g.position.y=0.1+0.25*sy+Math.sin(t/300)*0.05};persp(new V(0,0.3,0),1.4,0.6,0.35)},
'Marco':()=>{const pared=new THREE.Mesh(new THREE.BoxGeometry(3,3,0.2),new THREE.MeshLambertMaterial({color:0x6b6b6b}));pared.position.z=-0.6;raiz.add(pared);const tabla=new THREE.Mesh(new THREE.BoxGeometry(0.75,0.75,0.0625),new THREE.MeshLambertMaterial({color:0x8a5a2b}));tabla.position.z=-0.47;raiz.add(tabla);
raiz.add(conMatriz(itemGrupo(C.fixed,'fixed'),new M4().makeRotationY(Math.PI).multiply(new M4().makeTranslation(0,0,0.4375)).multiply(new M4().makeScale(0.5,0.5,0.5))));persp(new V(0,0,-0.4),1.6,0,0)},
'Item display':()=>{raiz.add(piso());raiz.add(conMatriz(itemGrupo(C.none,'none'),new M4().makeTranslation(0,0.5,0).multiply(new M4().makeRotationY(Math.PI))));persp(new V(0,0.5,0),2,0.6,0.35)}};
let prim=null;for(const[n,f]of Object.entries(vistas)){const b=boton(n,()=>{limpia();f()},'v');prim=prim||b}setTimeout(()=>prim.click());
const sin=Object.entries(C).filter(([k,v])=>!v).map(([k])=>k);
nota.textContent=(sin.length?'Sin modelo propio en: '+sin.join(', ')+' (el juego lo dibuja aparte; se muestra una caja). ':'')+'Primera y tercera persona y cabeza son aproximadas al juego.';
}
let dr=null,pinch=0;
el.addEventListener('pointerdown',e=>{dr=[e.clientX,e.clientY];el.setPointerCapture(e.pointerId)});
el.addEventListener('pointermove',e=>{if(!dr||!orbita)return;yaw-=(e.clientX-dr[0])*0.01;pitch=Math.max(-1.4,Math.min(1.4,pitch+(e.clientY-dr[1])*0.01));dr=[e.clientX,e.clientY]});
el.addEventListener('pointerup',()=>dr=null);
el.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(0.3,Math.min(20,dist*(1+Math.sign(e.deltaY)*0.1)))},{passive:false});
el.addEventListener('touchmove',e=>{if(e.touches.length==2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)dist=Math.max(0.3,Math.min(20,dist*pinch/d));pinch=d}},{passive:true});
el.addEventListener('touchend',()=>pinch=0);
function rs(){const w=el.clientWidth,h=el.clientHeight;R.setSize(w,h);camP.aspect=w/h;camP.updateProjectionMatrix()}rs();addEventListener('resize',rs);
(function loop(t){if(orbita&&cam==camP){camP.position.set(centro.x+dist*Math.cos(pitch)*Math.sin(yaw),centro.y+dist*Math.sin(pitch),centro.z+dist*Math.cos(pitch)*Math.cos(yaw));camP.lookAt(centro);if(camP.fov!=50){camP.fov=50;camP.updateProjectionMatrix()}}
if(anim)anim(t||0);R.render(S,cam);requestAnimationFrame(loop)})();
</script></body></html>
